# Keep it plain hides the streak capsule and coin balance, keeps them hidden
# through new activity, and toggling back loses nothing.
# See docs/06-gamification.md#restraint-rules (rule 5).
appId: com.getter.loop
---
- runFlow: ../subflows/reset.yaml
- runFlow: ../subflows/onboarded.yaml
- assertVisible:
    id: "screen-orbit"

# Bank today so there is a streak and a coin balance to hide.
- tapOn:
    id: "check-in-button"
- extendedWaitUntil:
    visible: "DAY BANKED"
    timeout: 15000
- assertVisible:
    id: "streak-capsule"
# Coins are awarded by onCheckInCreate on the server.
- extendedWaitUntil:
    visible:
      id: "orbit-coin-balance"
    timeout: 30000

# Turn Keep it plain on.
# The You screen is taller than the viewport and the tab dock floats over
# its bottom: centre the row first so the tap lands on it, not the dock.
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible:
      id: "screen-profile"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "profile-keep-it-plain-switch"
    centerElement: true
- tapOn:
    id: "profile-keep-it-plain-switch"

- tapOn:
    id: "tab-index"
- extendedWaitUntil:
    visible:
      id: "screen-orbit"
    timeout: 10000
- assertNotVisible:
    id: "streak-capsule"
- assertNotVisible:
    id: "orbit-coin-balance"

# New activity still shows nothing gamified.
- tapOn:
    id: "dock-add"
- extendedWaitUntil:
    visible:
      id: "entry-amount"
    timeout: 15000
- tapOn:
    id: "pad-key-4"
- tapOn:
    id: "pad-key-0"
- tapOn:
    id: "category-chip-FOOD"
- tapOn:
    id: "entry-save"
- extendedWaitUntil:
    visible:
      id: "screen-orbit"
    timeout: 15000
- assertNotVisible:
    id: "streak-capsule"
- assertNotVisible:
    id: "orbit-coin-balance"

# Toggle back: the ledger kept accruing, so everything returns.
- tapOn:
    id: "tab-profile"
- scrollUntilVisible:
    element:
      id: "profile-keep-it-plain-switch"
    centerElement: true
- tapOn:
    id: "profile-keep-it-plain-switch"
- tapOn:
    id: "tab-index"
- extendedWaitUntil:
    visible:
      id: "streak-capsule"
    timeout: 10000
- assertVisible:
    id: "orbit-coin-balance"
