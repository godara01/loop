# Check in offline: the day banks instantly, survives a kill and relaunch while
# still offline, and reconciles on reconnect to exactly one check-in doc and a
# server-awarded balance. See docs/06-gamification.md acceptance criteria.
appId: com.getter.loop
# Never leave the emulator offline for the next flow, pass or fail.
onFlowComplete:
  - setAirplaneMode: disabled
---
- runFlow: ../subflows/reset.yaml
- runFlow: ../subflows/onboarded.yaml
- assertVisible:
    id: "screen-orbit"

- setAirplaneMode: enabled

# Optimistic: the plate and streak update with no server.
- tapOn:
    id: "check-in-button"
- extendedWaitUntil:
    visible: "DAY BANKED"
    timeout: 5000
- assertVisible:
    id: "streak-capsule"
    text: "1 day streak"

# Kill and relaunch, still offline: the banked day comes back from the cache.
# (Metro is reached over adb reverse, which airplane mode does not cut.)
- runFlow: ../subflows/launch.yaml
- extendedWaitUntil:
    visible:
      id: "screen-orbit"
    timeout: 30000
- assertVisible: "DAY BANKED"

- setAirplaneMode: disabled

# Reconcile: onCheckInCreate awards coins once the write lands.
- extendedWaitUntil:
    visible:
      id: "orbit-coin-balance"
    timeout: 60000
- assertVisible: "DAY BANKED"
- assertVisible:
    id: "streak-capsule"
    text: "1 day streak"

# Exactly one check-in on the server.
- runScript:
    file: ../scripts/query.js
    env:
      COLLECTION: "checkIns"
- assertTrue: ${output.docs.length == 1}
