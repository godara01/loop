# A spend the user already typed by hand is not offered again when the bank's
# SMS arrives minutes later. See docs/12-sms-ingest.md#deduplication.
appId: com.getter.loop
env:
  SMS_SENDER: "AD-HDFCBK"
  SMS_BODY: "Rs.450.00 spent on HDFC Bank Card x1234 at SWIGGY on 2026-09-12:20:15:11."
  CONTROL_SENDER: "AD-HDFCBK"
  CONTROL_BODY: "Rs.111.00 spent on HDFC Bank Card x1234 at CONTROLCAFE on 2026-09-12:20:15:11.Avl bal: Rs.80,000.00"
  # scripts/e2e-flow.mjs delivers these once SMS_AFTER shows in the output.
  SMS_AFTER: "Tap on id: entry-save\\.\\.\\. COMPLETED"
  SMS_SEND: "SMS_BODY,4,CONTROL_BODY"
---
- runFlow: ../subflows/reset.yaml
- runFlow: ../subflows/onboarded.yaml
- runFlow: ../subflows/sms-enable-capture.yaml

# Type ₹450 by hand first.
- tapOn:
    id: "dock-add"
- tapOn:
    id: "pad-key-4"
- tapOn:
    id: "pad-key-5"
- tapOn:
    id: "pad-key-0"
- tapOn:
    id: "category-chip-FOOD"
- tapOn:
    id: "entry-save"
- extendedWaitUntil:
    visible:
      id: "screen-orbit"
    timeout: 10000

# The SMS arrives, then the control: only the control may become pending.
- runFlow: ../subflows/sms-await-control.yaml
- runScript:
    file: ../scripts/query.js
    env:
      COLLECTION: "pendingExpenses"
- assertTrue: ${output.docs.length == 1}
- assertTrue: ${output.docs[0].merchant == "CONTROLCAFE"}
