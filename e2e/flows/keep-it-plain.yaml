# Keep it plain switch hides gamification UI.
# See docs/06-gamification.md#restraint-rules.
appId: com.getter.loop
---
- runFlow: ../subflows/reset.yaml
- runFlow: ../subflows/launch.yaml
- assertVisible:
    id: "screen-orbit"

# Initial state: capsule and coins visible
- assertVisible:
    testID: "orbit-coin-balance"

# Go to profile
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible:
      id: "screen-profile"
    timeout: 10000

# Toggle "Keep it plain"
- tapOn:
    id: "profile-keep-it-plain-switch"

# Return to orbit
- tapOn:
    id: "tab-orbit"
- extendedWaitUntil:
    visible:
      id: "screen-orbit"
    timeout: 10000

# Verify capsule and coin balance are hidden
- assertNotVisible:
    testID: "orbit-coin-balance"
