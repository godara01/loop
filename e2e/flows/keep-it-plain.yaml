# Keep it plain switch hides gamification UI.
# See docs/06-gamification.md#restraint-rules.
appId: com.getter.loop
---
- runFlow: ../subflows/reset.yaml
- runFlow: ../subflows/onboarded.yaml
- assertVisible:
    id: "screen-orbit"

# Initial state: capsule and coins visible
- assertVisible:
    testID: "orbit-coin-balance"

# Go to profile
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible:
      id: "screen-profile"
    timeout: 10000

# Toggle "Keep it plain"
# The You screen is taller than the viewport and the tab dock floats over
# its bottom: centre the row first so the tap lands on it, not the dock.
- scrollUntilVisible:
    element:
      id: "profile-keep-it-plain-switch"
    centerElement: true
- tapOn:
    id: "profile-keep-it-plain-switch"

# Return to orbit
- tapOn:
    id: "tab-orbit"
- extendedWaitUntil:
    visible:
      id: "screen-orbit"
    timeout: 10000

# Verify capsule and coin balance are hidden
- assertNotVisible:
    testID: "orbit-coin-balance"
