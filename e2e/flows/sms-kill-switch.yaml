# With the Remote Config kill switch off, granting the permission reads nothing
# and says so; an arriving debit creates nothing. See docs/12-sms-ingest.md.
# REMOTE_CONFIG_SMS_INGEST below makes scripts/e2e-flow.mjs publish
# `sms_ingest_enabled = false` to loop-app-0403 for the run, and back after.
appId: com.getter.loop
env:
  SMS_SENDER: "AD-HDFCBK"
  SMS_BODY: "Rs.450.00 spent on HDFC Bank Card x1234 at SWIGGY on 2026-09-12:20:15:11."
  # scripts/e2e-flow.mjs delivers these once SMS_AFTER shows in the output.
  SMS_AFTER: "Tap on id: auto-capture-back\\.\\.\\. COMPLETED"
  SMS_SEND: "SMS_BODY"
  REMOTE_CONFIG_SMS_INGEST: "false"
---
- runFlow: ../subflows/reset.yaml
- runFlow: ../subflows/onboarded.yaml

- tapOn:
    id: "tab-profile"
# The You screen is taller than the viewport and the tab dock floats over
# its bottom: centre the row first so the tap lands on it, not the dock.
- scrollUntilVisible:
    element:
      id: "profile-auto-capture"
    centerElement: true
- tapOn:
    id: "profile-auto-capture"
- tapOn:
    id: "auto-capture-enable"
- repeat:
    times: 2
    commands:
      - runFlow:
          when:
            visible: "Allow"
          commands:
            - tapOn: "Allow"
# Permission saved, but capture reports it is switched off.
- extendedWaitUntil:
    visible:
      id: "auto-capture-error"
    timeout: 20000
- assertVisible: "Auto-capture is switched off for now.*"
- tapOn:
    id: "auto-capture-back"
- tapOn:
    id: "tab-index"

# Nothing may arrive: give the delivered SMS 20s to (not) become a badge.
- extendedWaitUntil:
    visible:
      id: "orbit-inbox-badge"
    timeout: 20000
    optional: true
- assertNotVisible:
    id: "orbit-inbox-badge"
- runScript:
    file: ../scripts/query.js
    env:
      COLLECTION: "pendingExpenses"
- assertTrue: ${output.docs.length == 0}
