# M5: Day detail screen with swipe navigation
appId: com.getter.loop
---
- runFlow: ../subflows/reset.yaml
- runFlow: ../subflows/onboarded.yaml

# Create expenses for today and yesterday
- tapOn:
    id: "dock-add"
- extendedWaitUntil:
    visible:
      id: "entry-amount"
    timeout: 15000
- tapOn:
    id: "pad-key-1"
- tapOn:
    id: "pad-key-2"
- tapOn:
    id: "pad-key-0"  # ₹120 FOOD today
- tapOn:
    id: "category-chip-FOOD"
- tapOn:
    id: "entry-save"
- extendedWaitUntil:
    visible:
      id: "screen-orbit"
    timeout: 15000

- tapOn:
    id: "dock-add"
- extendedWaitUntil:
    visible:
      id: "entry-amount"
    timeout: 15000
- tapOn:
    id: "pad-key-8"
- tapOn:
    id: "pad-key-0"  # ₹80 TRANSPORT yesterday
- tapOn:
    id: "category-chip-TRANSPORT"
- tapOn:
    id: "entry-date-earlier"
- tapOn:
    id: "entry-save"
- extendedWaitUntil:
    visible:
      id: "screen-orbit"
    timeout: 15000

# Navigate to Insights
- tapOn:
    id: "tab-insights"
- extendedWaitUntil:
    visible:
      id: "insights-period-total"
    timeout: 15000

# Tap on today's day cell to open day detail
- tapOn:
    id: "insights-day-today"
- extendedWaitUntil:
    visible:
      id: "screen-day-detail"
    timeout: 15000

# Verify today's total
- assertVisible:
    id: "day-detail-total"
    text: "₹120.00"

# Step to yesterday with the previous-day control, then back again with a swipe
# (swiping right goes to the previous day, left to the next).
- tapOn:
    id: "day-previous"
- assertVisible:
    id: "day-detail-total"
    text: "₹80.00"
- swipe:
    direction: LEFT
    from:
      id: "day-detail-total"
- assertVisible:
    id: "day-detail-total"
    text: "₹120.00"

# Back to insights
- tapOn:
    id: "day-back"
- assertVisible:
    id: "insights-period-total"
