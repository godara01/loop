# Check-in offline, kill app, reconnect, verify sync (no duplicate check-in).
# See docs/02-onboarding.md and docs/06-gamification.md#idempotency.
appId: com.getter.loop
---
- runFlow: ../subflows/reset.yaml
- runFlow: ../subflows/launch.yaml
- assertVisible:
    id: "screen-orbit"

# Enter airplane mode
- setAirplaneMode: on

# Tap check-in
- tapOn:
    id: "check-in-plate"
- wait: 2000

# Kill and relaunch
- stopApp
- openLink: "exp+loop://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- extendedWaitUntil:
    visible:
      id: "screen-orbit"
    timeout: 30000

# Should still be checked in (offline cached)
- assertVisible:
    id: "check-in-plate"

# Exit airplane mode
- setAirplaneMode: off
- wait: 3000

# Verify only one check-in on server
- runScript:
    file: ../scripts/query-check-ins.js
- assertTrue: "${output.docs.length == 1}"
