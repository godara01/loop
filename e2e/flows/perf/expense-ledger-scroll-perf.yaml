# Assumes the backend is ALREADY seeded (scripts/perf-ledger.sh does the
# seeding) — this flow only launches and scrolls. See docs/03-expenses.md
# (ledger must stay smooth at thousands of expenses).
appId: com.getter.loop
---
- runFlow: ../../subflows/launch.yaml
- tapOn:
    id: "tab-activity"
- assertVisible:
    id: "screen-ledger"

- repeat:
    times: 25
    commands:
      - swipe:
          from:
            id: "screen-ledger"
          direction: UP
          duration: 250

# Reached the bottom of a large list without a crash or a stuck loading state.
- assertVisible:
    id: "screen-ledger"

- repeat:
    times: 10
    commands:
      - swipe:
          from:
            id: "screen-ledger"
          direction: DOWN
          duration: 250
- assertVisible:
    id: "screen-ledger"
