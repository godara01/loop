# Check-in on a zero-spend day awards streak + zero_spend bonus coins.
# See docs/06-gamification.md#daily-check-in.
appId: com.getter.loop
---
- runFlow: ../subflows/reset.yaml
- runFlow: ../subflows/launch.yaml
- assertVisible:
    id: "screen-orbit"

# Tap the check-in plate (no expenses yet)
- tapOn:
    id: "check-in-plate"
- extendedWaitUntil:
    visible:
      id: "orbit-coin-balance"
    timeout: 5000

# Verify coins appear (8 = 5 check_in + 3 zero_spend)
- assertVisible:
    id: "orbit-coin-balance"
