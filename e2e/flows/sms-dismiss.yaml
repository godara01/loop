# Dismiss marks the item rejected and keeps it (rejections are the post-MVP
# training signal); nothing is added to the ledger. See docs/12-sms-ingest.md#the-inbox.
# Runner (D6): deliver adb emu sms send "$SMS_SENDER" "$SMS_BODY".
appId: com.getter.loop
env:
  SMS_SENDER: "VM-ICICIB"
  SMS_BODY: "ICICI Bank Acct XX567 debited for Rs 1,299.00 on 12-Sep-26; CODECADEMY credited. UPI:625812345678."
---
- runFlow: ../subflows/reset.yaml
- runFlow: ../subflows/onboarded.yaml
- runFlow: ../subflows/sms-enable-capture.yaml

- extendedWaitUntil:
    visible:
      id: "orbit-inbox-badge"
    timeout: 60000
- tapOn:
    id: "orbit-inbox-badge"
- assertVisible: "CODECADEMY"
- tapOn:
    id: "pending-card-.*-dismiss"
- extendedWaitUntil:
    visible:
      id: "inbox-empty"
    timeout: 10000

- runScript:
    file: ../scripts/query.js
    env:
      COLLECTION: "pendingExpenses"
- assertTrue: ${output.docs.length == 1}
- assertTrue: ${output.docs[0].status == 'rejected'}
- runScript:
    file: ../scripts/query.js
    env:
      COLLECTION: "expenses"
- assertTrue: ${output.docs.length == 0}
