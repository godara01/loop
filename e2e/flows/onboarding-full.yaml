# All five steps, no skips. docs/02: a profile doc, 8 active categories, one
# expense, a streak of 1, and a coin balance that settles non-zero once the
# Function runs.
appId: com.getter.loop
---
- runFlow: ../subflows/reset.yaml
- runFlow: ../subflows/launch.yaml

# Step 1 — Welcome
- extendedWaitUntil:
    visible:
      id: "screen-onboarding-welcome"
    timeout: 15000
- tapOn:
    id: "onboarding-start"

# Step 2 — Profile (name + currency)
- extendedWaitUntil:
    visible:
      id: "screen-onboarding-profile"
    timeout: 15000
- tapOn:
    id: "onboarding-name-input"
- inputText: "Test User"
- runFlow: ../subflows/dismiss-stylus-tip.yaml
- tapOn:
    id: "onboarding-currency-INR"
- tapOn:
    id: "onboarding-profile-continue"

# Step 3 — Feel
- extendedWaitUntil:
    visible:
      id: "screen-onboarding-feel"
    timeout: 15000
- tapOn:
    id: "onboarding-feel-continue"

# Step 4 — Categories (the 8 essentials, as offered)
- extendedWaitUntil:
    visible:
      id: "screen-onboarding-categories"
    timeout: 15000
- tapOn:
    id: "onboarding-categories-continue"

# Step 5 — First expense: ₹500 on Food
- extendedWaitUntil:
    visible:
      id: "screen-onboarding-first-expense"
    timeout: 15000
- tapOn:
    id: "pad-key-5"
- tapOn:
    id: "pad-key-0"
- tapOn:
    id: "pad-key-0"
- tapOn:
    id: "category-chip-FOOD"
- tapOn:
    id: "onboarding-save-expense"

# Orbit: today's expense, a 1-day streak, and coins once the Function lands.
- extendedWaitUntil:
    visible:
      id: "screen-orbit"
    timeout: 15000
- assertVisible:
    id: "orbit-today-total"
    text: "₹500.00"
- assertVisible:
    id: "streak-capsule"
    text: "1 day streak"
- extendedWaitUntil:
    visible:
      id: "orbit-coin-balance"
    timeout: 30000

# What was stored.
- runScript:
    file: ../scripts/query.js
    env:
      PROFILE: "1"
      COLLECTION: "expenses"
- assertTrue: ${output.docs.length == 1}
- assertTrue: ${output.docs[0].amountMinor == 50000}
- assertTrue: ${output.profile.onboardedAt != null}
- assertTrue: ${output.profile.displayName == "Test User"}
- assertTrue: ${output.profile.currency == "INR"}
- runScript:
    file: ../scripts/query.js
    env:
      COLLECTION: "categories"
- assertTrue: ${output.docs.filter(d => d.archivedAt == null).length == 8}
- runScript:
    file: ../scripts/query.js
    env:
      DOC: "streak/main"
- assertTrue: ${output.doc.current == 1}
- runScript:
    file: ../scripts/query.js
    env:
      DOC: "wallet/main"
- assertTrue: ${output.doc.coinBalance > 0}
