# Full pipeline: pick a real photo → crop to a centred square → resize →
# upload to Storage → the category document points at the uploaded path.
# See docs/04-categories.md#uploaded-logos.
#
# Run via `npm run e2e -- e2e/flows/category-custom-logo.yaml`, but only after
# `bash scripts/seed-gallery-image.sh` — this flow does not seed its own photo,
# since that needs adb, not Maestro's scripting engine.
#
# The system Photo Picker (Android 13+) is a different app with no stable
# testIDs of ours to select by; tapping the first grid tile by position is the
# best available option and is the one part of this flow most likely to need a
# human's eyes if the OS picker's layout ever shifts.
# Precondition (the device, not the app): the gallery holds at least one image,
# which the picker shows first. On a fresh emulator:
#   adb push apps/mobile/assets/images/icon.png /sdcard/Pictures/loop-test-logo.png
#   adb shell content call --method scan_volume --uri content://media --arg external_primary
appId: com.getter.loop
---
- runFlow: ../subflows/reset.yaml
- runFlow: ../subflows/onboarded.yaml

- tapOn:
    id: "tab-profile"
# The You screen is taller than the viewport and the tab dock floats over
# its bottom: centre the row first so the tap lands on it, not the dock.
- scrollUntilVisible:
    element:
      id: "profile-manage-categories"
    centerElement: true
- tapOn:
    id: "profile-manage-categories"
- tapOn:
    id: "manage-add"
- extendedWaitUntil:
    visible:
      id: "catalogue-search"
    timeout: 15000
# The footer link sits after ~60 catalogue entries. Searching for something
# that matches nothing collapses the list to just the empty state + footer,
# so the link is on-screen immediately with no scrolling needed.
- tapOn:
    id: "catalogue-search"
- inputText: "zzznomatch"
- tapOn:
    id: "catalogue-create-custom"

- extendedWaitUntil:
    visible:
      id: "editor-name"
    timeout: 15000
- tapOn:
    id: "editor-name"
- inputText: "Gym Buddy"
- runFlow: ../subflows/dismiss-stylus-tip.yaml
# The keyboard covers the glyph grid, colours and Save.
- hideKeyboard

- tapOn:
    id: "editor-upload-logo"
- extendedWaitUntil:
    visible:
      text: "Photos"
    timeout: 15000
# The first image in the system photo picker, by its accessibility label —
# a fixed screen point lands on the "Recent" header on current pickers.
- tapOn:
    text: "Photo taken on.*"
    index: 0

- extendedWaitUntil:
    notVisible:
      text: "Preparing…"
    timeout: 15000
- tapOn:
    id: "editor-save"

- extendedWaitUntil:
    notVisible:
      id: "editor-save"
    timeout: 20000
- assertVisible:
    text: "Gym Buddy"

- runScript:
    file: ../scripts/query.js
    env:
      COLLECTION: "categories"
- assertTrue: ${output.docs.filter(d => d.slug == "GYMBUDDY").length == 1}
- assertTrue: ${output.docs.filter(d => d.slug == "GYMBUDDY")[0].icon.kind == "image"}
# The category is saved at once with the local file:// path; the upload runs
# after the sheet closes and rewrites the path when it lands. Poll for it.
- retry:
    maxRetries: 6
    commands:
      - waitForAnimationToEnd:
          timeout: 3000
      - runScript:
          file: ../scripts/query.js
          env:
            COLLECTION: "categories"
      - assertTrue: ${output.docs.filter(d => d.slug == "GYMBUDDY")[0].icon.path.indexOf("categoryLogos") != -1}
