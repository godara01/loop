# DP3/DP4: Backdate a transaction using the date picker sheet.
# The date picker opens from entry-date-pick on the expense sheet.
appId: com.getter.loop
---
- runFlow: ../subflows/reset.yaml
- runFlow: ../subflows/onboarded.yaml
- assertVisible:
    id: "screen-orbit"

# Open expense entry
- tapOn:
    id: "dock-add"
- extendedWaitUntil:
    visible:
      id: "entry-amount"
    timeout: 15000

# Type amount
- tapOn:
    id: "pad-key-5"
- tapOn:
    id: "pad-key-0"
- tapOn:
    id: "pad-key-0"
- tapOn:
    id: "category-chip-FOOD"

# Open date picker
- tapOn:
    id: "entry-date-pick"
- extendedWaitUntil:
    visible:
      id: "date-picker-sheet"
    timeout: 15000

# Tap a past day (7 days ago: 2026-10-03)
- tapOn:
    id: "date-picker-day-2026-10-03"
- tapOn:
    id: "date-picker-done"

# Save the expense
- tapOn:
    id: "entry-save"
- extendedWaitUntil:
    visible:
      id: "screen-orbit"
    timeout: 15000

# Verify on ledger
- tapOn:
    id: "tab-activity"
- extendedWaitUntil:
    visible:
      id: "screen-ledger"
    timeout: 15000
