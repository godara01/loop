# The "+" chip in the entry sheet's category strip opens the catalogue and
# returns with the new category selected and the typed amount untouched.
# See docs/03-expenses.md#quick-add-behaviours.
appId: com.getter.loop
---
- runFlow: ../subflows/reset.yaml
- runFlow: ../subflows/onboarded.yaml

- tapOn:
    id: "dock-add"
- extendedWaitUntil:
    visible:
      id: "entry-amount"
    timeout: 15000

- tapOn:
    id: "pad-key-4"
- tapOn:
    id: "pad-key-5"
- assertVisible:
    text: "₹45"

# The "+" chip is the last item in a horizontally-scrolling strip, past the
# eight essentials — off the right edge until scrolled to. scrollUntilVisible
# picks up the screen's outer vertical ScrollView instead of this nested
# horizontal one, and an element-anchored swipe risks losing its own anchor
# once that chip scrolls away — so this swipes fixed screen points instead,
# at the category strip's known height.
- swipe:
    start: "85%,21%"
    end: "10%,21%"
- swipe:
    start: "85%,21%"
    end: "10%,21%"
- tapOn:
    id: "category-chip-add"
- extendedWaitUntil:
    visible:
      id: "catalogue-search"
    timeout: 15000
- tapOn:
    id: "catalogue-search"
- inputText: "Gym"
- runFlow: ../subflows/dismiss-stylus-tip.yaml
- tapOn:
    id: "catalogue-item-GYM"
# The Add button sits at the bottom, under the open keyboard.
- hideKeyboard
- tapOn:
    id: "catalogue-add"

# Back on the entry sheet: the amount survived the detour, and GYM is selected.
- extendedWaitUntil:
    visible:
      id: "entry-amount"
    timeout: 15000
- assertVisible:
    text: "₹45"
- assertVisible:
    id: "category-chip-GYM"

- tapOn:
    id: "entry-description"
- inputText: "Workout"
- tapOn:
    id: "entry-save"

- extendedWaitUntil:
    visible:
      id: "screen-orbit"
    timeout: 15000
- assertVisible:
    text: "₹45.00"

- runScript:
    file: ../scripts/query.js
    env:
      COLLECTION: "expenses"
- assertTrue: ${output.docs.length == 1}
- assertTrue: ${output.docs[0].amountMinor == 4500}
