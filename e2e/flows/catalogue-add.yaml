# Browse the catalogue from Manage, search, multi-select, add — then verify the
# server has exactly what was picked. See docs/04-categories.md#tier-2--the-catalogue.
appId: com.getter.loop
---
- runFlow: ../subflows/reset.yaml
- runFlow: ../subflows/onboarded.yaml

- tapOn:
    id: "tab-profile"
# The You screen is taller than the viewport and the tab dock floats over
# its bottom: centre the row first so the tap lands on it, not the dock.
- scrollUntilVisible:
    element:
      id: "profile-manage-categories"
    centerElement: true
- tapOn:
    id: "profile-manage-categories"
- extendedWaitUntil:
    visible:
      id: "manage-active-list"
    timeout: 15000

- tapOn:
    id: "manage-add"
- extendedWaitUntil:
    visible:
      id: "catalogue-search"
    timeout: 15000

- tapOn:
    id: "catalogue-search"
- inputText: "Coffee"
- runFlow: ../subflows/dismiss-stylus-tip.yaml
- tapOn:
    id: "catalogue-item-COFFEE"
# The Add button sits at the bottom, under the open keyboard.
- hideKeyboard
- tapOn:
    id: "catalogue-add"

- extendedWaitUntil:
    visible:
      id: "manage-active-list"
    timeout: 15000
- assertVisible:
    text: "Coffee & tea"

- runScript:
    file: ../scripts/query.js
    env:
      COLLECTION: "categories"
- assertTrue: ${output.docs.length == 9}
- assertTrue: ${output.docs.filter(d => d.slug == "COFFEE").length == 1}
- assertTrue: ${output.docs.filter(d => d.slug == "COFFEE")[0].kind == "catalogue"}
- assertTrue: ${output.docs.filter(d => d.slug == "COFFEE")[0].catalogueSlug == "COFFEE"}
