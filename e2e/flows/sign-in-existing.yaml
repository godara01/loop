# Sign in with an existing Google account.
# NOTE: Real Google sign-in cannot complete on the emulator (no Google account).
# Owner-run: tap onboarding-already-use-loop and manually complete the system picker.
appId: com.getter.loop
---
- runFlow: ../subflows/reset.yaml
- runFlow: ../subflows/launch.yaml

# Assert we are on the Welcome screen
- extendedWaitUntil:
    visible:
      id: "screen-onboarding-welcome"
    timeout: 15000

# Tap "I already use Loop" (triggers sign-in with Google)
- tapOn:
    id: "onboarding-already-use-loop"

# The Google system picker cannot be automated on the emulator.
# Assert the app stays alive (Welcome screen still visible or on screen-orbit if a linked account was used)
- extendedWaitUntil:
    visible:
      id: "screen-onboarding-welcome"
    timeout: 15000
