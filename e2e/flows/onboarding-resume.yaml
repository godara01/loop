# Kill mid-onboarding, relaunch, resume at same step with answers preserved.
# See docs/02-onboarding.md#acceptance-criteria.
appId: com.getter.loop
---
- runFlow: ../subflows/reset.yaml
- runFlow: ../subflows/launch.yaml

# Step 1 — Welcome
- assertVisible:
    id: "screen-onboarding-welcome"
- tapOn:
    id: "onboarding-start"

# Step 2 — Profile (partially fill)
- extendedWaitUntil:
    visible:
      id: "screen-onboarding-profile"
    timeout: 15000
- tapOn:
    id: "onboarding-profile-name-input"
- inputText: "Resume Test"
- tapOn:
    id: "onboarding-profile-currency-USD"

# Kill the app
- stopApp
- openLink: "exp+loop://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"

# Should be back at profile step with name and USD still there
- extendedWaitUntil:
    visible:
      id: "screen-onboarding-profile"
    timeout: 30000
- assertVisible:
    text: "Resume Test"

# Complete the flow
- tapOn:
    id: "onboarding-profile-continue"
- extendedWaitUntil:
    visible:
      id: "screen-onboarding-feel"
    timeout: 15000
- tapOn:
    id: "onboarding-feel-skip"
- extendedWaitUntil:
    visible:
      id: "screen-onboarding-categories"
    timeout: 15000
- tapOn:
    id: "onboarding-categories-skip"
- extendedWaitUntil:
    visible:
      id: "screen-onboarding-first-expense"
    timeout: 15000
- tapOn:
    id: "entry-skip"

# Land on Orbit
- extendedWaitUntil:
    visible:
      id: "screen-orbit"
    timeout: 15000
