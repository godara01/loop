# Archive removes a category from Active without deleting it; unarchive brings
# it straight back. See docs/04-categories.md#archiving-and-deleting.
appId: com.getter.loop
---
- runFlow: ../subflows/reset.yaml
- runFlow: ../subflows/onboarded.yaml

- tapOn:
    id: "tab-profile"
# The You screen is taller than the viewport and the tab dock floats over
# its bottom: centre the row first so the tap lands on it, not the dock.
- scrollUntilVisible:
    element:
      id: "profile-manage-categories"
    centerElement: true
- tapOn:
    id: "profile-manage-categories"
- extendedWaitUntil:
    visible:
      id: "manage-active-list"
    timeout: 15000

- tapOn:
    id: "manage-archive-FUN"
- assertNotVisible:
    id: "manage-row-FUN"

- tapOn:
    id: "manage-toggle-archived"
- assertVisible:
    id: "manage-row-FUN"

- runScript:
    file: ../scripts/query.js
    env:
      COLLECTION: "categories"
- assertTrue: ${output.docs.filter(d => d.slug == "FUN")[0].archivedAt != null}

- tapOn:
    id: "manage-unarchive-FUN"
- tapOn:
    id: "manage-toggle-archived"
- assertVisible:
    id: "manage-row-FUN"

- runScript:
    file: ../scripts/query.js
    env:
      COLLECTION: "categories"
- assertTrue: ${output.docs.filter(d => d.slug == "FUN")[0].archivedAt == null}
