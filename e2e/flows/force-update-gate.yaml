# DP1: Force update gate appears when build is outdated.
# Note: Triggering the gate requires Remote Config manipulation (owner-run).
appId: com.getter.loop
---
- runFlow: ../subflows/reset.yaml
- runFlow: ../subflows/onboarded.yaml

# Verify the update gate is visible
- assertVisible:
    id: "update-gate"
- assertVisible:
    id: "update-gate-update"
