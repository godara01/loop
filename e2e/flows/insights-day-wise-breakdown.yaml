# M5: Day-wise breakdown verification
appId: com.getter.loop
---
- runFlow: ../subflows/reset.yaml
- runFlow: ../subflows/onboarded.yaml
# Create expenses for multiple days
- tapOn:
    id: "dock-add"
- extendedWaitUntil:
    visible:
      id: "entry-amount"
    timeout: 15000
- tapOn:
    id: "pad-key-1"
- tapOn:
    id: "pad-key-0"
- tapOn:
    id: "pad-key-0"  # ₹100 on day 1 (today)
- tapOn:
    id: "category-chip-FOOD"
- tapOn:
    id: "entry-save"
- extendedWaitUntil:
    visible:
      id: "screen-orbit"
    timeout: 15000
- tapOn:
    id: "dock-add"
- extendedWaitUntil:
    visible:
      id: "entry-amount"
    timeout: 15000
- tapOn:
    id: "pad-key-5"
- tapOn:
    id: "pad-key-0"  # ₹50 on day 2 (yesterday)
- tapOn:
    id: "category-chip-TRANSPORT"
- tapOn:
    id: "entry-date-yesterday"
- tapOn:
    id: "entry-save"
- extendedWaitUntil:
    visible:
      id: "screen-orbit"
    timeout: 15000
# Go to Insights and verify day-wise breakdown
- tapOn:
    id: "tab-insights"
- extendedWaitUntil:
    visible:
      id: "insights-period-total"
    timeout: 15000
- assertVisible:
    text: "₹150.00"  # Total
# Day cells show only the day number; each one's amount is in its label
# ("2026-09-27, ₹100.00"), which Maestro matches as text.
- assertVisible:
    id: "insights-day-today"
    text: ".*₹100\\.00"
- assertVisible:
    text: ".*, ₹50\\.00"
# Drill down into today, then step back a day inside day detail.
- tapOn:
    id: "insights-day-today"
- extendedWaitUntil:
    visible:
      id: "screen-day-detail"
    timeout: 15000
- assertVisible:
    id: "day-detail-total"
    text: "₹100.00"
- tapOn:
    id: "day-previous"
- assertVisible:
    id: "day-detail-total"
    text: "₹50.00"
- tapOn:
    id: "day-back"
- tapOn:
    id: "insights-period-week"
- assertVisible:
    id: "insights-period-current"
- stopApp
